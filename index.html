<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FAF9F5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Lexi · 阅读消化</title>
<style>
  /* ===== Tokens（lexi/01 推导）=====
     字号 22/15/12 · 行高 1.6 · 缩进 28/级 · 纸 #FAF9F5 墨 #2A2722
     颜色只给"正在发生"；等级只走字重/墨深轴；结构线 1px --ink18 */
  :root {
    --paper:#FAF9F5; --ink:#2A2722;
    --ink55:rgba(42,39,34,.55); --ink18:rgba(42,39,34,.18);
    --accent:#3B6EF6;
    --g1:12px; --g2:24px; --g4:48px; --indent:28px; --pad:20px;
    --ease:cubic-bezier(0.32,0.72,0,1);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; background:#E9E6DF; }
  body { font-family:Georgia,"Times New Roman","Songti SC",serif; }
  #device { width:390px; height:844px; margin:24px auto; background:var(--paper); color:var(--ink);
    border-radius:24px; overflow:hidden; position:relative; box-shadow:0 0 0 8px #DDD9D0; }
  .screen { position:absolute; inset:0; background:var(--paper); overflow-y:auto;
    transform:translateX(100%); transition:transform 350ms var(--ease); visibility:hidden; }
  .screen.active { transform:none; visibility:visible; }
  #lib.screen { transform:none; }         /* 库是根，不参与右滑进场 */
  ::-webkit-scrollbar { display:none; }
  button { font-family:inherit; background:none; border:none; cursor:pointer; color:inherit;
    touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
  .row, .import, .cancel, .act { touch-action:manipulation; }

  /* ===== 顶行 ===== */
  .top { position:sticky; top:0; z-index:5; background:var(--paper);
    display:flex; align-items:baseline; gap:var(--g1);
    padding:28px var(--pad) var(--g1); font-size:12px; font-family:-apple-system,"PingFang SC",sans-serif; }
  .top .back { color:var(--ink55); font-size:20px; line-height:1; padding:0 4px; }
  .top .ttl { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--ink55); }
  .top .count { color:var(--ink55); white-space:nowrap; }
  .top .count.zero { color:var(--ink18); }

  /* ===== 文章库：纯文本流 + 间距，无卡片无边框 ===== */
  .lib { padding:var(--g2) var(--pad) calc(48px + env(safe-area-inset-bottom, 0px)); }
  .lib .brand { font-size:12px; color:var(--ink55); margin-bottom:var(--g1); }
  .lib .brand b { color:var(--ink); font-weight:600; }
  .art { padding:var(--g2) 0; cursor:pointer; }
  .art .t { font-size:15px; line-height:1.5; color:var(--ink); }
  .art .m { font-size:12px; color:var(--ink55); margin-top:4px; display:flex; gap:var(--g2); }
  /* 状态优先级：有未消化果 → 标题加粗（墨更实）；全退休 → 整行淡出（复用退休态语义） */
  .art.pending .t { font-weight:600; }
  .art.faded { opacity:.45; }
  .art.faded .t { font-weight:400; }
  .lib .import { display:block; text-align:left; padding:var(--g1) 0;
    font-size:12px; color:var(--ink55); }

  /* ===== 正文 ===== */
  .body { padding:var(--g2) var(--pad) 0; font-size:22px; line-height:1.6; }
  .body p { margin-bottom:var(--g2); }
  .w { cursor:pointer; -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none; user-select:none; touch-action:manipulation; }
  .w.adv { font-weight:600; }
  .w.flash { color:var(--accent); }          /* 点击瞬间的"正在发生" */
  .dagger { font-size:12px; color:var(--ink55); vertical-align:super; cursor:pointer;
    -webkit-tap-highlight-color:transparent; user-select:none; touch-action:manipulation; }

  /* ===== 果实区：随文流，结构线分层 ===== */
  .fruit-zone { margin:calc(-1*var(--g1)) 0 var(--g2) var(--indent);
    padding-left:var(--g1); border-left:1px solid var(--ink18);
    display:none; }
  .fruit-zone.on { display:block; animation:open 200ms var(--ease); }
  @keyframes open { from { opacity:0; transform:translateY(-.4em); } }
  .fruit { font-size:15px; line-height:1.5; margin-bottom:var(--g1); }
  .fruit .quote { font-size:12px; color:var(--ink55); margin-bottom:2px; }
  .fruit .skeleton-l { font-weight:600; }
  .fruit .para-l { font-size:12px; color:var(--ink55); }
  .fruit .ext { font-size:12px; color:var(--ink55); margin-top:2px; cursor:pointer; }
  .fruit .ext-list { display:none; font-size:12px; color:var(--ink55); margin-top:2px; }
  .fruit .ext-list.on { display:block; }
  .fruit .meta { font-size:12px; margin-top:2px; }
  .fruit.ai .meta { color:var(--ink55); }    /* AI 的果更淡 */
  .fruit.me .meta { color:var(--ink); }      /* 我的果更实 */
  /* 重叠分层：词果比句果再深一档（词的从属层级比句更低），共用父级结构线，不新开线 */
  .fruit.me { margin-left:var(--g1); padding-left:var(--g1); border-left:1px solid var(--ink18); }
  .more-tip { font-size:12px; color:var(--ink55); cursor:pointer; }

  /* 英译英/英译中切换：顶行里的一个文字开关，当前语言墨实，另一侧墨淡 */
  .langsw { font-size:12px; color:var(--ink18); white-space:nowrap; touch-action:manipulation; }
  .langsw span { color:var(--ink55); padding:0 2px; }
  .langsw span.on { color:var(--ink); font-weight:600; }
  /* 点击即生成：12px 步进省略号，有事件才有动画 */
  .gen { font-size:12px; color:var(--ink55); margin-top:2px; }
  .gen::after { content:"…"; display:inline-block; overflow:hidden; vertical-align:bottom;
    width:0; animation:dots 1.2s steps(4) infinite; }
  /* 例句：12px 淡墨，缩进一档 */
  .ex-l { font-size:12px; color:var(--ink55); padding-left:var(--g1); margin-top:2px; line-height:1.5; }
  .ex-l::before { content:"· "; }
  .card .ex-l { padding-left:var(--indent); }

  #apiBox { padding:var(--g1) 0; }
  #apiBox input { width:100%; border:none; background:none; outline:none; font-family:inherit;
    font-size:15px; color:var(--ink); caret-color:var(--accent);
    border-bottom:1px solid var(--ink18); padding:var(--g1) 0; }
  #apiBox input:focus { border-bottom-color:var(--accent); }
  /* 解析失败：一行锈色文字即重试入口，无弹窗无按钮 */
  .err-link { font-size:12px; color:#B0502F; cursor:pointer; margin-top:2px; touch-action:manipulation; }

  /* ===== 文尾收束 ===== */
  .end { padding:var(--g1) var(--pad) calc(48px + env(safe-area-inset-bottom, 0px)); font-size:15px; }
  .end .go { display:block; text-align:left; padding:var(--g1) 0; color:var(--ink55); font-size:15px; }
  .end .go.done { color:var(--ink18); }

  /* ===== 消化视图 ===== */
  .digest { padding:0 var(--pad) calc(48px + env(safe-area-inset-bottom, 0px)); }
  .digest .hint { font-size:12px; color:var(--ink55); padding:var(--g1) 0; }
  .card { margin-bottom:var(--g2); transition:opacity 350ms var(--ease); }
  .card .quote { font-size:12px; color:var(--ink55); line-height:1.55; margin-bottom:var(--g1); cursor:pointer; }
  .card .quote b { color:var(--ink); font-weight:600; }
  .card .replay { font-size:15px; line-height:1.6; margin-bottom:var(--g1); }
  .card .replay .clause { color:var(--ink55); }
  .card .skeleton { font-size:15px; font-weight:600; line-height:1.6; margin-bottom:var(--g1); padding-left:var(--indent); }
  .card .skeleton .lbl { font-weight:400; font-size:12px; color:var(--ink55); margin-right:var(--g1); }
  .card .skeleton .tag { display:block; font-weight:400; font-size:12px; color:var(--ink55); margin-top:2px; }
  .card .para { font-size:12px; color:var(--ink55); padding-left:var(--indent); margin-bottom:var(--g1); }
  .card .meta { font-size:12px; color:var(--ink55); padding-left:var(--indent);
    display:flex; gap:var(--g2); align-items:baseline; }
  .card .meta .src-me { color:var(--ink); }
  .card .meta .retire { margin-left:auto; }
  .card .meta .retire:hover { color:var(--ink); }
  .card.retired { opacity:.45; }
  .card.retired .replay, .card.retired .skeleton { text-decoration:line-through; text-decoration-thickness:1px; }
  .card.retired .retire { color:var(--ink18); }
  .card.retired .quote b { color:var(--ink55); }

  /* ===== 导入层 / 萃取确认层：整层纸张，无卡片无表单框 ===== */
  #import,#confirm { position:absolute; inset:0; background:var(--paper); z-index:10; display:none;
    padding:calc(28px + env(safe-area-inset-top, 0px)) var(--pad) var(--g4); overflow-y:auto;
    font-family:-apple-system,"PingFang SC",sans-serif; }
  #import.on,#confirm.on { display:block; }
  #import .row { font-size:15px; line-height:1.5; padding:var(--g2) 0; color:var(--ink55); cursor:pointer; }
  #import .row.open { color:var(--ink); }
  #import textarea,#import .url-in { width:100%; border:none; background:none; outline:none;
    font-family:inherit; font-size:15px; line-height:1.6; color:var(--ink);
    caret-color:var(--accent); border-bottom:1px solid var(--ink18); padding:var(--g1) 0; resize:none; }
  #import textarea:focus,#import .url-in:focus { border-bottom-color:var(--accent); }
  #import .tip,#confirm .tip { font-size:12px; color:var(--ink55); margin-top:var(--g1); }
  /* 警告色：唯一一次破例。铁锈色系，纸面上"淡但不误读"，永不做弹窗 */
  #import .err { font-size:12px; color:#B0502F; margin-top:var(--g1); }
  #import .acts { display:flex; align-items:baseline; gap:var(--g2); margin-top:var(--g1); }
  #import .cancel.inline { margin-top:0; }
  #import .act,#confirm .act { display:block; text-align:left; background:none; border:none; cursor:pointer;
    padding:var(--g1) 0; font-size:15px; color:var(--ink); }
  #import .act.dim { color:var(--ink18); pointer-events:none; }
  #import .cancel,#confirm .cancel { display:block; text-align:left; background:none; border:none; cursor:pointer;
    padding:var(--g1) 0; font-size:12px; color:var(--ink55); margin-top:var(--g2); }
  /* 萃取中的等待：有事件才有动画；省略号原地呼吸，不转圈不遮罩 */
  #import .wait { font-size:15px; color:var(--ink55); padding:var(--g2) 0; }
  #import .wait::after { content:"…"; display:inline-block; overflow:hidden; vertical-align:bottom;
    width:0; animation:dots 1.2s steps(4) infinite; }
  @keyframes dots { to { width:1.1em; } }
  /* 中间确认态：一段结论文字 + 两个文字动作，预算制——选择权交还用户 */
  #confirm .t { font-size:15px; font-weight:600; line-height:1.5; }
  #confirm .found { font-size:15px; line-height:1.6; margin:var(--g2) 0 var(--g4); }
  #confirm .sub { font-size:12px; color:var(--ink55); margin-top:var(--g1); font-weight:400; }
</style>
</head>
<body>
<div id="device">

  <!-- 文章库（默认首页） -->
  <section id="lib" class="screen active">
    <div class="top">
      <div class="ttl"><b style="color:var(--ink)">Lexi</b> · 文章库</div>
      <div class="count" id="libTotal"></div>
    </div>
    <div class="lib">
      <div class="brand">源在这里，果挂在源上</div>
      <div id="artList"></div>
      <button class="import" id="importBtn">＋ 导入新文章（粘贴文本）</button>
      <button class="import" id="apiBtn">[ ⚙ 设置 API Key ]</button>
      <div id="apiBox" style="display:none">
        <input id="apiIn" type="password" placeholder="sk-…" autocomplete="off">
        <div class="acts">
          <button class="cancel inline" id="apiCancel">取消</button>
          <button class="act" id="apiSave">保存</button>
        </div>
        <div class="tip">部署到 Netlify 后请求走同源代理，Key 可只配在服务端环境变量；未部署时回退直连，Key 存本机 localStorage</div>
      </div>
    </div>
  </section>

  <!-- 阅读视图 -->
  <section id="read" class="screen">
    <div class="top">
      <button class="back" id="backLib">‹</button>
      <div class="ttl" id="rTtl"></div>
      <button class="langsw" id="langSw"></button>
      <div class="count" id="count"></div>
    </div>
    <div class="body" id="article"></div>
    <div class="end"><button class="go" id="goDigest"></button></div>
  </section>

  <!-- 消化视图 -->
  <section id="digest" class="screen">
    <div class="top">
      <button class="back" id="backRead">‹</button>
      <div class="ttl" id="dTtl"></div>
      <button class="langsw" id="langSw2"></button>
      <div class="count" id="count2"></div>
    </div>
    <div class="digest" id="digestBody"></div>
  </section>

  <!-- 导入层：JSON 主路 + 链接萃取辅路，无表单 -->
  <div id="import">
    <div id="importMenu">
      <div class="row" id="rowJson">粘贴导入（① 原文 ② AI 解析）</div>
      <div id="jsonBox" style="display:none">
        <textarea id="bodyTa" rows="8" placeholder="① 文章原文：直接粘贴整段英文，空行分段……"></textarea>
        <textarea id="jsonTa" rows="7" placeholder='② 解析结果 JSON：只含 words / sentences，不含全文（全文由上面单独粘贴）'></textarea>
        <div class="err" id="jsonErr" style="display:none"></div>
        <div class="acts">
          <button class="cancel inline" id="jsonCancel">取消</button>
          <button class="act dim" id="jsonGo">解析并导入</button>
        </div>
      </div>
      <div class="row" id="rowUrl">从链接萃取（模拟分享）</div>
      <div id="urlBox" style="display:none">
        <input class="url-in" id="urlIn" type="url" placeholder="https:// …" autocomplete="off">
        <button class="act dim" id="urlGo">萃取</button>
      </div>
      <button class="cancel" id="importCancel">取消</button>
    </div>
    <div class="wait" id="importWait" style="display:none">AI 萃取中</div>
  </div>

  <!-- 中间确认态：AI 标了多少，读者说了算 -->
  <div id="confirm">
    <div class="t" id="cTitle"></div>
    <div class="found" id="cFound"></div>
    <button class="act" id="cRead">开始阅读</button>
    <button class="act" id="cRaw">什么都不标，先读原版</button>
    <button class="cancel" id="cCancel">退回文章库</button>
  </div>
</div>

<script>
/* ===== 文章库：优先读本地，冷启动才用 Mock ===== */
const LS_KEY="lexi_data";
function defaultArts(){
  return [
  {
    title:"The Mathematics of Randomness", date:"10 月 25 日",
    paras:[
      "In 1733, Abraham de Moivre sat in a London coffee house, calculating how winnings from a dice game should be divided. The question seemed narrow, yet the tool he forged that afternoon, the normal curve, now governs how we model everything from exam scores to the noise inside a radio signal.",
      "What makes randomness so difficult is that our intuitions were built on causes. When a gambler sees five red results in a row, she feels that black is due, although each spin is independent of the last. The gambler's fallacy is not stupidity; it is the brain applying a logic of causes to a world that, in this corner, has none.",
      "Modern probability theory handles this by refusing to talk about what will happen, and speaking only about the measure of what can happen. A statement like this coin probably lands heads has a precise meaning: among all possible outcomes, the heads branch carries a larger share of the total probability mass.",
      "The strange gift of large numbers is that chance, ignored one event at a time, becomes lawful in bulk. No single molecule of a gas has a temperature, yet the cloud of them obeys the gas laws with an almost offensive precision."
    ],
    adv:["forged","governs","intuitions","independent","fallacy","refusing","measure","probability mass","offensive precision","lawful in bulk","due"],
    sentences:[
      { anchor:"The strange gift of large numbers",
        replay:"The strange gift of large numbers is that chance, [ignored one event at a time], becomes lawful in bulk.",
        skeleton:"The gift becomes lawful.", tag:"S V C · 主系表",
        para:"主干是 The gift becomes lawful（主系表）。[ignored one event at a time] 是过去分词短语作插入语，修饰 chance，不是句子成分的核心。",
        ext:["单数主语 + 分词插入语：插入语可先删掉再读主干","类比: The theory, [once accepted], changed everything."] },
      { anchor:"A statement like",
        replay:"A statement like this coin probably lands heads has a precise meaning: [among all possible outcomes], the heads branch carries a larger share of the total probability mass.",
        skeleton:"A statement has a meaning; the branch carries a share.", tag:"并列双主干 · 冒号展开",
        para:"冒号前是主干 A statement has a precise meaning，其中 this coin probably lands heads 是同位语从句省略 that；冒号后是并列句解释 meaning。",
        ext:["同位语从句省略 that 是科普文体常见压缩","先找冒号：冒号后的内容通常是对前的展开"] }
    ]
  },
  {
    title:"Curvature: Where Straight Lines End", date:"10 月 24 日",
    paras:[
      "A straight line is the shortest path only on a flat surface. On a sphere, the shortest path between two cities bends, and pilots call it a great circle. The rule does not change; the space it lives in does.",
      "Gauss proved that curvature is intrinsic: a two-dimensional creature living on a surface could measure it without ever leaving. This idea, later extended by Riemann, became the language in which Einstein wrote gravity as the curvature of spacetime."
    ],
    adv:["curvature","intrinsic","spacetime","extended"],
    sentences:[
      { anchor:"Gauss proved",
        replay:"Gauss proved [that curvature is intrinsic]: a two-dimensional creature living on a surface could measure it [without ever leaving].",
        skeleton:"Gauss proved that …; a creature could measure it.", tag:"主谓宾 + 宾语从句 · 分号并列",
        para:"proved 的宾语是一个完整的从句；分号后用一个小生物的类比重述同一件事，是科普的双视角写法。",
        ext:["宾语从句内再嵌不定式：without ever leaving 作方式状语","Gauss 与 Theorema Egregium：内蕴几何的起点"] }
    ]
  }
  ];
}

/* 持久化：文章、AI/我标记的果实、"懂了"退休态全部落 localStorage。
   Set 不能直接序列化，retired 存数组；读回时复活成 Set。 */
function saveLexi(){
  try {
    localStorage.setItem(LS_KEY, JSON.stringify({ v:1, at:Date.now(), arts:ARTS.map(a=>({
      title:a.title, date:a.date, paras:a.paras, adv:a.adv, gloss:a.gloss||{}, sentences:a.sentences,
      fruits:a.fruits, retired:[...a.retired], expanded:a.expanded, fid:a.fid
    }))}));
  } catch(e) { /* 配额满/隐私模式：内存态照常可用，只是不持久 */ }
}

let ARTS, cur=-1;
try {
  const saved=JSON.parse(localStorage.getItem(LS_KEY)||"null");
  if(saved && Array.isArray(saved.arts) && saved.arts.length){
    ARTS=saved.arts.map(a=>({ ...a,
      fruits:a.fruits||{}, retired:new Set(a.retired||[]),
      expanded:a.expanded||{}, fid:a.fid||0 }));
  } else throw 0;
} catch(e){
  ARTS=defaultArts();
  ARTS.forEach(a=>{ a.fruits={}; a.retired=new Set(); a.expanded={}; a.fid=0; });
}

const STOP=new Set(("a an the in on at of to for from by with as and or but nor so yet is are was were be been being "
 +"has have had do does did it its this that these those he she they we you i his her their our your my me him them us "
 +"not no if when while although because than then there here what which who whom whose how why where all any more most "
 +"such very can could may might must shall should will would").split(" "));

/* ===== 阶段 6：DeepSeek 真实接入 =====
   Key 只存本机 localStorage；纯前端直连 api.deepseek.com（官方允许 CORS）。
   强约束：response_format=json_object + 兜底清洗 ```json 围栏，双保险。 */
const API_URL="https://api.deepseek.com/chat/completions";
/* 同源代理（Netlify Functions）：部署到 Netlify 后自动生效。
   部署了代理 → Key 可只放服务端环境变量，前端零 Key；
   没部署（本地文件/其他托管）→ 404 自动回退直连，用本机 Key。 */
const PROXY_URL = /^https?:$/.test(location.protocol)
  ? location.origin + "/.netlify/functions/lexi" : null;
function getApiKey(){ try{ return localStorage.getItem("lexi_api_key")||""; }catch(e){ return ""; } }
function cleanJsonTxt(t){
  return String(t).replace(/^```(?:json)?\s*/i,"").replace(/```\s*$/,"").trim();
}
function friendlyErr(status){
  const map={ 401:"Key 无效", 402:"余额不足", 429:"请求过频，稍后再试" };
  return map[status] || ("HTTP "+status);
}
async function callEndpoint(url, withKey, payload){
  const headers={ "Content-Type":"application/json" };
  const key=getApiKey();
  if(withKey && key) headers.Authorization="Bearer "+key;
  const res=await fetch(url,{ method:"POST", headers, body:payload });
  if(!res.ok) throw new Error(friendlyErr(res.status));
  const data=await res.json();
  const txt=cleanJsonTxt((data.choices&&data.choices[0]&&data.choices[0].message.content)||"");
  try { return JSON.parse(txt); }
  catch(e){ throw new Error("返回的不是合法 JSON"); }
}
async function deepseekChat(prompt){
  const payload=JSON.stringify({ model:"deepseek-chat", temperature:0.3,
    response_format:{ type:"json_object" },
    messages:[{ role:"user", content:prompt }] });
  if(PROXY_URL){
    try {
      const r=await callEndpoint(PROXY_URL, false, payload);   /* Key 在服务端环境变量 */
      console.log("[Lexi] 经代理调用成功");
      return r;
    } catch(e){
      console.warn("[Lexi] 代理不可用/失败，尝试直连:", e.message);
      if(!getApiKey()) throw new Error("未设置 API Key");   /* 本机也没有 Key：如实提示 */
    }
  }
  const r=await callEndpoint(API_URL, true, payload);
  console.log("[Lexi] 直连调用成功");
  return r;
}
const EXTRACT_PROMPT=body=>
`你是严谨的英语导师。对下面的文章做阅读解析，只输出一个 JSON 对象，不要 markdown、不要解释文字：
{"words":[{"word":"原文中逐字出现的词或多词短语","gloss":"中文词性+释义，20字内","glossEn":"English-English definition, one line","examples":["真实语境例句1","例句2"]}],"sentences":[{"quote":"与原文逐字一致的长难句","replay":"重放句，从句/插入语用[方括号]包住","skeleton":"英文主干","tag":"中文句式标签","para":"中文讲解","paraEn":"English explanation","examples":["例句"]}]}
要求：words 取 5~8 个对 CEFR B1 偏难的词块（可以是短语，边界由你划定）；sentences 取 2~3 个真正的长难句；quote/word 必须与原文逐字一致，找不到的不要输出；JSON 必须合法，无尾逗号。
文章：
${body}`;
const WORD_PROMPT=(word,sent)=>
`你是英语导师。解释「${word}」在句子「${sent}」中的含义。只输出一个 JSON 对象：
{"phonetic":"含重音的音标","gloss":{"cn":"中文释义（本句语境）","en":"English-English definition"},"examples":["使用该词的地道例句1","例句2"]}
JSON 必须合法，无 markdown、无解释文字。`;

/* 真实解析：占位果 → DeepSeek → 回填（音标/双语释义/例句）或失败态（可点击重试） */
async function aiResolve(a,pi,f){
  const sent=sentenceOf(a,pi,f.word);
  try {
    const r=await deepseekChat(WORD_PROMPT(f.word, sent));
    f.pending=false; delete f.error;
    f.phonetic=r.phonetic?String(r.phonetic):"";
    f.gloss={ cn:r.gloss&&r.gloss.cn?String(r.gloss.cn):undefined,
              en:r.gloss&&r.gloss.en?String(r.gloss.en):undefined };
    f.examples=Array.isArray(r.examples)?r.examples.map(String):[];
    console.log("[Lexi] AI 解析完成:", f.word);
  } catch(e){
    f.pending=false; f.error=String(e.message||e);
    console.warn("[Lexi] AI 解析失败:", f.word, e.message);
  }
  if(a.expanded[pi]) renderFruits(pi);
  renderCounts(); saveLexi();
}

/* 兼容性关键：不使用正则 lookbehind（iOS Safari < 16.4 不支持，
   且 regex 字面量在脚本解析期编译，一旦不识别整个 <script> 直接 SyntaxError，
   所有事件绑定全部失效——症状就是"点了没反应"）。 */
function splitSentences(s){
  const out=[]; let buf="";
  for(let i=0;i<s.length;i++){
    buf+=s[i];
    if(/[.!?]/.test(s[i])){
      let j=i+1; while(j<s.length && /[.!?]/.test(s[j])){ buf+=s[j]; j++; }
      if(j>=s.length || /\s/.test(s[j])){ if(buf.trim()) out.push(buf.trim()); buf=""; i=j-1; }
    }
  }
  if(buf.trim()) out.push(buf.trim());
  return out;
}

function pendingN(a){
  let n=0;
  for(const k in a.fruits) a.fruits[k].forEach(f=>{ if(!a.retired.has(f.id)) n++; });
  return n;
}
function totalCards(a){ let n=0; for(const k in a.fruits) n+=a.fruits[k].length; return n; }

function normalizeTxt(s){ return String(s).toLowerCase().replace(/\s+/g," ").replace(/[’`]/g,"'"); }
function buildArticle(bodyText, obj){
  obj = obj || {};
  /* 正文优先取原文框；兼容旧版"JSON 自带 paras"的用法 */
  let paras = bodyText.trim()
    ? bodyText.trim().split(/\n\s*\n/).map(s=>s.trim()).filter(Boolean)
    : (Array.isArray(obj.paras) ? obj.paras.map(p=>String(p).trim()).filter(Boolean) : []);
  if(!paras.length) throw new Error("请先粘贴文章原文");
  const np = paras.map(normalizeTxt);
  /* 生词：在正文里找不到的直接忽略（乱填的 JSON 也不崩） */
  const words = (Array.isArray(obj.words)?obj.words:[]).filter(w=>w&&String(w.word||"").trim());
  const preWords = words.map(w=>{
    const nw=normalizeTxt(String(w.word));
    const pi=np.findIndex(p=>new RegExp("\\b"+nw.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\b").test(p));
    if(pi<0) return null;
    return { pi, word:String(w.word).trim(),
      gloss:(w.gloss||w.glossEn)?{ cn:w.gloss?String(w.gloss):undefined, en:w.glossEn?String(w.glossEn):undefined }:undefined,
      examples:Array.isArray(w.examples)?w.examples.map(String):undefined };
  }).filter(Boolean);
  /* 长难句：整句匹配 → 退化到前 5 词；找不到的忽略，不报错 */
  const sentences = (Array.isArray(obj.sentences)?obj.sentences:[]).map(s=>{
    if(!s) return null;
    const q=String(s.quote||"").trim();
    if(!q || !String(s.replay||"").trim() || !String(s.skeleton||"").trim()) return null;
    const nq=normalizeTxt(q);
    let pi=np.findIndex(p=>p.includes(nq));
    if(pi<0){ const head=nq.split(" ").slice(0,5).join(" "); pi=np.findIndex(p=>p.includes(head)); }
    if(pi<0) return null;
    return { anchor:q.slice(0,40), pi,
      replay:String(s.replay).trim(), skeleton:String(s.skeleton).trim(),
      tag:String(s.tag||"").trim(), para:String(s.para||"").trim(),
      paraEn:String(s.paraEn||"").trim(),
      ext:Array.isArray(s.ext)?s.ext.map(String):[],
      examples:Array.isArray(s.examples)?s.examples.map(String):[] };
  }).filter(Boolean);
  const title=(String(obj.title||"").trim())
    || splitSentences(paras[0])[0].slice(0,48) || "未命名文章";
  const a={ title, date:"今天", paras, adv:[], gloss:{}, sentences };
  words.forEach(w=>{ if(w.gloss||w.glossEn)
    a.gloss[String(w.word).toLowerCase()]={ cn:w.gloss?String(w.gloss):undefined, en:w.glossEn?String(w.glossEn):undefined }; });
  a.preWords=preWords;
  a.fruits={}; a.retired=new Set(); a.expanded={}; a.fid=0;
  return a;
}
function seedJsonWords(a){
  (a.preWords||[]).forEach(w=>{
    addFruit(a,w.pi,{kind:"word", word:w.word, src:"ai", pending:false,
      gloss:w.gloss, examples:w.examples});
  });
  delete a.preWords;
}

/* ===== 正文渲染 ===== */
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;"); }
function isStop(w){ return STOP.has(w.toLowerCase()); }
/* 加粗单元：AI 结构词(a.adv) + 已存在的词果/短语果（含多词短语，整体激活）。
   长单元优先替换，短语内部的单词不会被 wrapWords 再拆散。 */
function markAdv(p,a){
  let s=esc(p);
  const mine=(a.fruits?Object.values(a.fruits).flat():[]).filter(f=>f.kind==="word").map(f=>({w:f.word,usr:1}));
  const units=mine.concat((a.adv||[]).map(w=>({w,usr:0}))).sort((x,y)=>y.w.length-x.w.length);
  units.forEach(({w,usr})=>{
    const re=new RegExp("\\b("+w.replace(/ /g,"\\s+")+")\\b","i");
    s=s.replace(re,'<span class="w adv" data-word="$1"'+(usr?' data-user="1"':'')+'>$1</span>');
  });
  return s;
}
function wrapWords(html, userWords){
  return html.split(/(<span[^>]*>.*?<\/span>)/).map(seg=>{
    if(seg.startsWith("<span")) return seg;
    return seg.replace(/[A-Za-z][A-Za-z'-]*/g, m=>{
      if(isStop(m)) return m;
      if(userWords && userWords.has(m.toLowerCase()))
        return `<span class="w adv" data-word="${m}" data-user="1">${m}</span>`;
      return `<span class="w" data-word="${m}">${m}</span>`;
    });
  }).join("");
}
function addFruit(a,pi,f){ (a.fruits[pi] ||= []).push(f); f.id="f"+(++a.fid); return f; }
function sentenceOf(a,pi,word){
  const hits=splitSentences(a.paras[pi]);
  return hits.find(x=>x.toLowerCase().includes(word.toLowerCase())) || a.paras[pi];
}

  a.paras.forEach((p,pi)=>{
    const el=document.createElement("div"); el.className="para-block";
    const list0 = a.fruits[pi]||[];
    const has = a.sentences.some(s=>p.includes(s.anchor)) || list0.length;
    const n0 = list0.filter(f=>!a.retired.has(f.id)).length;
    let html = wrapWords(markAdv(p,a));
    if(has) html += '<span class="dagger" data-p="'+pi+'">'+(n0>1?"†"+n0:"†")+'</span>';
    el.innerHTML=`<p>${html}</p><div class="fruit-zone" data-p="${pi}"></div>`;
    box.appendChild(el);
    renderFruits(pi);
  });
  renderCounts();
}
function renderFruits(pi){
  const a=ARTS[cur];
  const zone=document.querySelector('.fruit-zone[data-p="'+pi+'"]');
  if(!zone) return;
  zone.innerHTML="";
  if(!a.expanded[pi]){ zone.classList.remove("on"); return; }
  const list=a.fruits[pi]||[];
  zone.classList.add("on");
  /* 0) 生成态与失败态：AI 解析中占位 / 解析失败点击重试 */
  list.filter(f=>f.kind==="word"&&f.pending).forEach(f=>{
    const d=document.createElement("div"); d.className="fruit me";
    d.innerHTML=`<div>${esc(f.word)}</div><div class="gen">AI 解析中</div>`;
    zone.appendChild(d);
  });
  list.filter(f=>f.kind==="word"&&f.error).forEach(f=>{
    const d=document.createElement("div"); d.className="fruit me";
    d.innerHTML=`<div>${esc(f.word)}</div><div class="err-link">解析失败（${esc(f.error)}），点击重试</div>`;
    d.onclick=()=>{ f.pending=true; delete f.error; renderFruits(pi); aiResolve(a,pi,f); };
    zone.appendChild(d);
  });
  /* 1) 句果：意译走语言轴，例句 12px 淡墨缩进 */
  list.filter(f=>f.kind==="sentence").forEach(f=>{
    const d=document.createElement("div"); d.className="fruit ai";
    const exs=(f.data.examples||[]).map(e=>`<div class="ex-l">${esc(e)}</div>`).join("");
    d.innerHTML=`<div class="quote">${f.data.replay}</div>
      <div class="skeleton-l">${esc(f.data.skeleton)}${f.data.tag?` <span class="para-l">${esc(f.data.tag)}</span>`:""}</div>
      <div class="para-l">${esc(langParaOf(f.data))}</div>
      ${exs}
      ${f.data.ext.length?`<div class="ext">延伸 ×${f.data.ext.length} ▸</div><div class="ext-list">${f.data.ext.map(e=>"· "+esc(e)).join("<br>")}</div>`:""}
      <div class="meta">AI · 第 ${pi+1} 段</div>`;
    const extBtn=d.querySelector(".ext");
    if(extBtn) extBtn.onclick=()=>d.querySelector(".ext-list").classList.toggle("on");
    zone.appendChild(d);
  });
  /* 2) 已生成的词果按句合并：同一句话里的多个词共享一条引文 */
  const bySent={};
  list.filter(f=>f.kind==="word"&&!f.pending).forEach(f=>{
    const q=sentenceOf(a,pi,f.word);
    (bySent[q] ||= []).push(f);
  });
  Object.entries(bySent).forEach(([q,ws])=>{
    const d=document.createElement("div"); d.className="fruit "+(ws.some(f=>f.src==="me")?"me":"ai");
    let hl=esc(q);
    ws.forEach(f=>{ hl=hl.replace(new RegExp("\\b("+f.word.replace(/ /g,"\\s+")+")\\b","i"),"<b>$1</b>"); });
    const src=ws.every(f=>f.src==="ai")?"AI":(ws.every(f=>f.src==="me")?"我":"AI+我");
    const gl=ws.filter(f=>langGloss(f.gloss))
      .map(f=>`<div class="para-l">${esc(f.word)}${f.phonetic?` <span>${esc(f.phonetic)}</span>`:""}：${esc(langGloss(f.gloss))}</div>`).join("");
    const exs=ws.filter(f=>f.examples&&f.examples.length)
      .map(f=>f.examples.slice(0,2).map(e=>`<div class="ex-l">${esc(e)}</div>`).join("")).join("");
    d.innerHTML=`<div class="quote">${hl}</div>
      <div>${ws.map(f=>esc(f.word)).join(" · ")}<span class="para-l"> — 已记下，待消化</span></div>
      ${gl}${exs}
      <div class="meta">${src} · 第 ${pi+1} 段</div>`;
    zone.appendChild(d);
  });
  if(list.length>3){
    const tip=document.createElement("div"); tip.className="more-tip";
    tip.textContent="收起 ▴"; tip.onclick=()=>{ a.expanded[pi]=false; renderFruits(pi); };
    zone.appendChild(tip);
  }
}
function renderCounts(){
  const a=ARTS[cur];
  const n=pendingN(a), tot=totalCards(a);
  [document.getElementById("count"),document.getElementById("count2")].forEach(el=>{
    el.textContent="果 ×"+n; el.classList.toggle("zero",n===0);
  });
  const go=document.getElementById("goDigest");
  go.textContent = n>0 ? "还有 "+n+" 个果没消化 · 进入消化"
                 : (tot>0 ? "都消化完了 · 沉淀为 "+tot+" 张卡" : "还没有果实。读正文时点下不懂的词。");
  go.classList.toggle("done",n===0);
}

/* ===== 交互：零打断 ===== */
document.getElementById("article").addEventListener("click",e=>{
  const a=ARTS[cur];
  const w=e.target.closest(".w");
  if(w){
    const pi=[...document.querySelectorAll(".para-block")].findIndex(b=>b.contains(w));
    const word=w.dataset.word;
    if(w.classList.contains("adv")&&w.dataset.user!=="1") return; /* AI 词是结构信息 */
    if(w.dataset.user==="1"){
      w.classList.remove("adv"); delete w.dataset.user;
      const list=a.fruits[pi]||[];
      const idx=list.findIndex(f=>f.kind==="word"&&f.word.toLowerCase()===word.toLowerCase());
      if(idx>-1){ a.retired.delete(list[idx].id); list.splice(idx,1); }
    } else {
      w.classList.add("adv"); w.dataset.user="1";
      /* JSON 预置释义即刻落果；否则真实调用 DeepSeek（占位 → 结果/失败重试） */
      const g=a.gloss ? a.gloss[word.toLowerCase()] : undefined;
      const f=addFruit(a,pi,{kind:"word", word, src:"me",
        gloss:g||undefined, pending:!g});
      if(f.pending) aiResolve(a,pi,f);
      w.classList.add("flash"); setTimeout(()=>w.classList.remove("flash"),350);
    }
    syncDagger(a,pi);
    if(a.expanded[pi]) renderFruits(pi);   /* 已展开 → 立即看到新果；未展开 → 不抢视野 */
    renderCounts(); saveLexi(); return;
  }
  const dag=e.target.closest(".dagger");
  if(dag){
    const pi=+dag.dataset.p;
    a.expanded[pi]=!a.expanded[pi]; renderFruits(pi);
    if(a.expanded[pi]){
      const blk=document.querySelectorAll(".para-block")[pi];
      document.getElementById("read").scrollTo({ top:blk.offsetTop-64, behavior:"smooth" });
    }
  }
});
function syncDagger(a,pi){
  const block=document.querySelectorAll(".para-block")[pi];
  if(!block) return;
  const list=a.fruits[pi]||[];
  const need = a.sentences.some(s=>a.paras[pi].includes(s.anchor)) || list.length>0;
  const existing=block.querySelector(".dagger");
  if(need && !existing)
    block.querySelector("p").insertAdjacentHTML("beforeend",'<span class="dagger" data-p="'+pi+'"></span>');
  const dag=block.querySelector(".dagger");
  if(dag){
    /* † 上的数字 = 该段未消化果数：标记后即使段落折叠，也能看见"这里结了 N 个果" */
    const n=list.filter(f=>!a.retired.has(f.id)).length;
    dag.textContent = n>1 ? "†"+n : "†";
  }
}

/* ===== 导航 ===== */
function openArt(i){
  cur=i;
  renderArticle();
  document.getElementById("read").classList.add("active");
  document.getElementById("lib").classList.remove("active");
}
bindClick("backLib",()=>{
  document.getElementById("read").classList.remove("active");
  document.getElementById("lib").classList.add("active");
  renderLib();   /* 回库即刷新状态 */
});
bindClick("langSw",switchLang);
bindClick("langSw2",switchLang);
function switchLang(){
  LANG = LANG==="cn" ? "en" : "cn";
  try { localStorage.setItem("lexi_lang", LANG); } catch(e){}
  renderLangSw();
  console.log("[Lexi] 语言轴切换 →", LANG);
  renderArticle();   /* 果实区重渲染即换语，不打断阅读位置 */
  if(document.getElementById("digest").classList.contains("active")) renderDigest();
}
bindClick("goDigest",()=>{
  renderDigest();
  document.getElementById("digest").classList.add("active");
  document.getElementById("read").classList.remove("active");
});
bindClick("backRead",()=>{
  document.getElementById("digest").classList.remove("active");
  document.getElementById("read").classList.add("active");
  renderCounts();
});

/* ===== 消化视图 ===== */
function renderDigest(){
  const a=ARTS[cur];
  document.getElementById("dTtl").textContent="消化 · "+a.title;
  const box=document.getElementById("digestBody"); box.innerHTML="";
  const rows=[];
  for(const k in a.fruits) a.fruits[k].forEach(f=>rows.push({key:f.id, pi:+k, f}));
  if(!rows.length){ box.innerHTML='<div class="hint">还没有果实。回到正文，把不懂的地方记下来。</div>'; renderCounts(); return; }
  box.innerHTML='<div class="hint">原句是源，卡片是果。点卡片顶部的原句可回正文定位。</div>';
  rows.forEach(({key,pi,f})=>{
    const d=document.createElement("div");
    d.className="card"+(a.retired.has(key)?" retired":"");
    if(f.kind==="sentence"){
      const replay=f.data.replay.replace(/\[([^\]]+)\]/g,'<span class="clause">[$1]</span>');
      d.innerHTML=`<div class="quote" data-p="${pi}">${esc(a.paras[pi].slice(0,60))}…（第 ${pi+1} 段）</div>
        <div class="replay">${replay}</div>
        <div class="skeleton"><span class="lbl">骨架</span>${esc(f.data.skeleton)}${f.data.tag?`<span class="tag">${esc(f.data.tag)}</span>`:""}</div>
        <div class="para">${esc(langParaOf(f.data))}</div>
        ${(f.data.examples||[]).map(e=>`<div class="ex-l">${esc(e)}</div>`).join("")}
        <div class="meta"><span>AI</span><button class="retire">懂了</button></div>`;
    } else {
      const q=sentenceOf(a,pi,f.word).replace(new RegExp("\\b("+f.word.replace(/ /g,"\\s+")+")\\b","i"),"<b>$1</b>");
      const gl=f.pending?"AI 解析中…":(f.error?("解析失败（"+f.error+"）"):(langGloss(f.gloss)||"还没消化。回到正文读一遍这句，或让 AI 补释义与延伸。"));
      const exs=f.pending?"":(f.examples||[]).slice(0,2).map(e=>`<div class="ex-l">${esc(e)}</div>`).join("");
      d.innerHTML=`<div class="quote" data-p="${pi}">${esc(q)}</div>
        <div class="replay">${esc(f.word)}${f.phonetic?` <span class="para-l">${esc(f.phonetic)}</span>`:""}</div>
        <div class="para">${esc(gl)}</div>
        ${exs}
        <div class="meta"><span class="${f.src==="me"?"src-me":""}">${f.src==="me"?"我":"AI"}</span><button class="retire">懂了</button></div>`;
    }
    d.querySelector(".retire").onclick=()=>{
      a.retired.has(key)?a.retired.delete(key):a.retired.add(key);
      saveLexi(); renderDigest(); renderCounts();
    };
    d.querySelector(".quote").onclick=()=>{
      /* 双向锚定：回正文并展开该段果实 */
      document.getElementById("digest").classList.remove("active");
      document.getElementById("read").classList.add("active");
      a.expanded[pi]=true; renderFruits(pi);
      const blk=document.querySelectorAll(".para-block")[pi];
      document.getElementById("read").scrollTo({ top:blk.offsetTop-64, behavior:"smooth" });
    };
    box.appendChild(d);
  });
  renderCounts();
}

/* ===== 初始化：AI 果落位（仅冷启动；本地恢复的数据里已含果实，重放会重复）===== */
function seedAiFruits(a){
  a.sentences.forEach(s=>{
    /* JSON 导入的句子带精准段落号 pi；冷启动 Mock 走 anchor 文本匹配 */
    const pi=(s.pi!=null)? s.pi : a.paras.findIndex(p=>p.includes(s.anchor));
    if(pi>-1) addFruit(a,pi,{kind:"sentence", data:s, src:"ai"});
  });
}
ARTS.forEach(a=>{ if(Object.keys(a.fruits).length) return; seedAiFruits(a); });
renderLib();
renderLangSw();
console.log("[Lexi] 初始化完成 | 文章数:", ARTS.length,
  "| localStorage:", (()=>{ try{ return !!localStorage.getItem(LS_KEY); }catch(e){ return "不可用"; } })());
